<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13261c">
<title>KPTC Tuesday Paddle League</title>
<style>
html,body{margin:0;background:#f3f5f2;color:#14201a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bar{background:#13261c;color:#fff;padding:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 24px;text-align:center;color:#4b5a50;font-size:15px}
.spin{width:26px;height:26px;border:3px solid #dde4de;border-top-color:#1f6a45;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid #c9d2c8;background:#fff;color:#14201a;cursor:pointer}
</style>
</head>
<body>
<div class="bar">KPTC Tuesday Paddle League</div>
<div class="box" id="box"><div class="spin"></div><div>Loading</div></div>
<script>
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzBFLe_zcriQAQMPgu-3r4j0EtiX3SOzj5FQrNtC34Jk4AUjudUJUyvv8pykIbDu8NIAA/exec";
  var MARK = "__LADDER_DATA__";
  var K = "ladder:";
  var q = location.search || "";
  function get(k) { try { return localStorage.getItem(K + k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(K + k, v); } catch (e) { /* full or blocked: no copy */ } }
  function drop(k) { try { localStorage.removeItem(K + k); } catch (e) { /* ignore */ } }
  function show(tpl, data, stale) {
    var info = JSON.stringify({ api: API, stale: stale, query: q, key: K }).replace(/</g, "\\u003c");
    var html = tpl.replace(MARK, function () { return data; })
      .replace("<head>", function () { return "<head><script>window.__LADDER__ = " + info + ";</scr" + "ipt>"; });
    document.open();
    document.write(html);
    document.close();
  }
  function fail() {
    document.getElementById("box").innerHTML = "<div>Could not reach the league app. Check your connection.</div>" +
      "<button onclick=\"location.reload()\">Try again</button>";
  }
  var court = /[?&](court|claim)=/.test(q);
  var tpl = get("tpl"), ver = get("ver") || "", data = court ? null : get("data:" + q);
  // Last visit's copy shows at once; the app then fetches what changed. A copy that never started is skipped.
  if (tpl && data && !get("pending")) {
    set("pending", "1");
    // wait until this page has finished loading, so the app replaces it instead of being added below it
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { show(tpl, data, true); });
    else show(tpl, data, true);
    return;
  }
  drop("pending");
  var params = {};
  q.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("=");
    try {
      var k = decodeURIComponent((i < 0 ? kv : kv.slice(0, i)).replace(/\+/g, " "));
      if (k) params[k] = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    } catch (e) { /* skip a broken parameter */ }
  });
  fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ method: "page", payload: { params: params, have: tpl ? ver : "" } })
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r || !r.ok || !r.data) throw new Error("no page");
    var t = r.data.template || tpl;
    if (!t) throw new Error("no app");
    if (r.data.template) { set("tpl", r.data.template); set("ver", r.data.version || ""); }
    if (!court) set("data:" + q, r.data.params);
    show(t, r.data.params, false);
  }).catch(fail);
})();
</script>
</body>
</html>
